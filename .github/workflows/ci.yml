name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: semola
          POSTGRES_PASSWORD: semola
          POSTGRES_DB: semola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semola -d semola"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SEMOLA_POSTGRES_URL: postgres://semola:semola@localhost:5432/semola
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
